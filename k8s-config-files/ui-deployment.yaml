apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-deployment
  labels:
    app: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: registry.gitlab.com/guy-livne/ui-service:v1.0.0
        env:
        - name: REACT_APP_CALENDAR_API_URL
          valueFrom:
            configMapKeyRef:
              name: life-configmap
              key: REACT_APP_CALENDAR_API_URL
        ports:
        - containerPort: 80
      imagePullSecrets:
      - name: gitlab-registry-secret