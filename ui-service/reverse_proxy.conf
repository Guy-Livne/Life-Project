server {
    listen 80;
    server_name localhost;

    # 1. Serve the React UI
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This line is critical if you are using React Router!
        try_files $uri $uri/ /index.html; 
    }

    # 2. Proxy the API to the Compose backend
    location /calendar/create-event/api {
        # DO NOT USE LOCALHOST! Use the Docker Compose service name.
        proxy_pass http://calendar-service:8000/create-event;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}